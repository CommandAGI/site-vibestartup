<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.commandagi.com https://api-dev.commandagi.com http://127.0.0.1:* http://localhost:*; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>Console · VibeStartup</title>
<meta name="description" content="One business, its co-founder and every part of it: chat, the launch week, tasks, email, products, orders, customers, ads, studio, outbound, social, files, legal, settings, activity.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f12" media="(prefers-color-scheme: dark)">
<link rel="preload" href="/fonts/InstrumentSans-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/app/console.css">
<link rel="icon" href="/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/touch-icon.png">
<link rel="modulepreload" href="/app/console.js">
<link rel="modulepreload" href="/lib/api.js">
<link rel="modulepreload" href="/lib/business.js">
<link rel="modulepreload" href="/lib/ui.js">
<script src="/brand.js"></script>
</head>
<body class="console">
<a class="skip" href="#main">Skip to the content</a>

<aside class="rail" id="rail" aria-label="Console">
  <button type="button" class="biz-switch" id="biz-switch" aria-haspopup="menu" aria-label="Switch business">
    <span class="avatar" id="biz-avatar">·</span>
    <span class="biz-name"><b id="biz-name">Loading</b><small>Business</small></span>
  </button>
  <button type="button" class="search-btn" id="search-open" aria-label="Search (Ctrl+K)"><span class="search-ico"></span><span>Search</span><kbd>⌘K</kbd></button>
  <nav class="tabs" id="tabs" aria-label="Tabs"></nav>
  <div class="rail-foot">
    <a class="credits" id="credits" href="#page=billing" data-page="billing"><span class="credits-ico"></span><span><b id="credits-balance-rail">…</b> credits</span></a>
    <button type="button" class="account" id="account-menu" aria-haspopup="menu" aria-label="Account menu"><span class="avatar" id="me-avatar">·</span><span class="me-name" id="me-name">Account</span></button>
  </div>
</aside>

<div class="frame">
  <header class="topbar" id="topbar">
    <button type="button" class="btn icon rail-toggle" id="rail-toggle" aria-label="Menu" data-tip="Menu"></button>
    <h1 class="tab-title" id="tab-title">Chat</h1>
    <div class="actions" id="actions" role="toolbar" aria-label="Actions"></div>
  </header>
  <main id="main" tabindex="-1" aria-live="polite"></main>
  <aside class="panel-right" id="building" aria-label="What is being built" hidden></aside>
</div>

<nav class="bottombar" id="bottombar" aria-label="Tabs"></nav>

<dialog id="search" class="modal search" aria-label="Search">
  <div class="search-box">
    <input type="search" placeholder="Jump to a tab or a business…" autocomplete="off" aria-label="Search">
    <ul class="search-results" role="listbox"></ul>
  </div>
</dialog>

<script type="module" src="/app/console.js"></script>
</body>
</html>
