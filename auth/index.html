<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.commandagi.com https://api-dev.commandagi.com http://127.0.0.1:* http://localhost:*; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>Sign in | VibeStartup</title>
<meta name="description" content="Sign in to VibeStartup, or create your account.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f12" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/pages.css">
<link rel="icon" href="/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/touch-icon.png">
<script src="/brand.js"></script>
</head>
<body class="page-canvas">
<a class="skip" href="#main">Skip to the content</a>
<header class="page-head">
  <a class="brand" href="/" aria-label="VibeStartup, home"><picture><source srcset="/wordmark-dark.svg" media="(prefers-color-scheme: dark)"><img src="/wordmark.svg" alt="VibeStartup" width="86" height="24"></picture></a>
</header>

<main id="main" class="auth-main">
  <div class="auth-card">
    <form id="signup" autocomplete="on" novalidate onsubmit="event.preventDefault()">
      <h1>Create your account</h1>
      <p class="muted">Free credits to start. No card.</p>
      <label class="field"><span>Your name</span><input name="name" autocomplete="name" required maxlength="80" placeholder="Ada Lovelace"></label>
      <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label>
      <label class="field"><span>Password <small>at least 8 characters</small></span><span class="pw"><input name="password" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="pw-toggle" data-pw-toggle aria-label="Show password" aria-pressed="false"><svg class="i-show" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="i-hide" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7c1.7 0 3.2-.5 4.5-1.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></span></label>
      <label class="field"><span>Date of birth <small>the models your co-founder runs on need it</small></span><input name="birthdate" type="date" autocomplete="bday" required max="2020-12-31" min="1900-01-01"></label>
      <div id="turnstile" class="turnstile"></div>
      <p class="error" role="alert" data-error></p>
      <button class="btn primary lg full" type="submit">Create my account</button>
      <p class="auth-switch">Already have an account? <button type="button" data-auth-switch="signin">Sign in</button></p>
    </form>
    <form id="signin" autocomplete="on" novalidate hidden onsubmit="event.preventDefault()">
      <h1>Sign in</h1>
      <p class="muted">With your VibeStartup account, or any CommandAGI account.</p>
      <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>
      <label class="field"><span>Password</span><span class="pw"><input name="password" type="password" autocomplete="current-password" required><button type="button" class="pw-toggle" data-pw-toggle aria-label="Show password" aria-pressed="false"><svg class="i-show" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="i-hide" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7c1.7 0 3.2-.5 4.5-1.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></span></label>
      <p class="error" role="alert" data-error></p>
      <button class="btn primary lg full" type="submit">Sign in</button>
      <p class="auth-switch">New here? <button type="button" data-auth-switch="signup">Create an account</button></p>
    </form>
  </div>
  <p class="hint auth-foot">By continuing you accept CommandAGI's <a href="https://commandagi.com/terms" rel="noopener">terms</a> and <a href="https://commandagi.com/privacy" rel="noopener">privacy policy</a>.</p>
</main>

<footer class="site-foot">
  <div class="wrap"><a href="mailto:hello@vibestartup.pro">hello@vibestartup.pro</a><a href="/" class="right">Home</a></div>
</footer>
<script type="module" src="/auth/auth.js"></script>
</body>
</html>
